name: CraftTudo
version: '3.0.0'
main: br.com.puraresenha.crafttudo.CraftTudoPlugin
api-version: '26.3'
description: Fabricação em massa com filtros e compatibilidade Paper.
author: Pura-Resenha
commands:
  crafttudo:
    description: Abre o menu de fabricação em massa.
    usage: /crafttudo [buscar <texto>|limpar|recarregar]
    aliases: [craftall, craftmax]
permissions:
  crafttudo.use:
    description: Permite usar o menu CraftTudo.
    default: true
  crafttudo.admin:
    description: Permite recarregar receitas e configurações.
    default: op
