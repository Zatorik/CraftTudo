name: ResenhaAntiFreeze
version: '1.0.0'
main: br.com.puraresenha.resenhaantifreeze.ResenhaAntiFreezePlugin
api-version: '26.3'
description: Diagnostico de desempenho durante combates, com deteccao opcional de jogadores Bedrock via Floodgate.
author: Pura-Resenha
softdepend: [floodgate]
commands:
  antifreeze:
    description: Diagnostico de desempenho durante o PvP.
    usage: /antifreeze <status|report|reload>
    aliases: [afreeze, af]
permissions:
  resenhaantifreeze.admin:
    description: Permite consultar diagnosticos de todos os jogadores e recarregar o plugin.
    default: op
