name: Build CarryOnPaper

on:
  push:
    branches: [ "main" ]
    paths:
      - "CarryOnPaper/**"
      - ".github/workflows/carryonpaper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: CarryOnPaper
        run: gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CarryOnPaper-Paper-26.3-v1.4.1
          path: CarryOnPaper/build/libs/CarryOnPaper-1.4.1.jar
          if-no-files-found: error
          retention-days: 14
