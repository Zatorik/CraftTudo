name: Build ResenhaClans

on:
  push:
    branches: [ "main" ]
    paths:
      - "ResenhaClans/**"
      - ".github/workflows/resenhaclans.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: ResenhaClans
        run: gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ResenhaClans-Paper-26.3-v1.2.1
          path: ResenhaClans/build/libs/ResenhaClans-1.2.1.jar
          if-no-files-found: error
          retention-days: 14
